{% set name = "xeus-python-shell" %}
{% set version = "0.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/jupyter-xeus/xeus-python-shell/archive/refs/tags/{{ version }}.tar.gz
  sha256: 114bfac1146bfd03bc06ae01e9bcd2bdb185b4607e9ff58cd4b6a71dc2a64571

build:
  noarch: python
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  commands:
    - echo "tests in outputs"

outputs:
  - name: xeus-python-shell-raw
    build:
      noarch: python
      script: {{ PYTHON }} -m pip install . -vv --no-deps
    requirements:
      host:
        - pip
        - python {{ python_min }}
      run:
        - python >={{ python_min }}
      run_constrained:
        - debugpy >=1.4,<2
    test:
      requires:
        - pip
        - python {{ python_min }}
      imports:
        - xeus_python_shell

  - name: xeus-python-shell
    build:
      noarch: python
    requirements:
      host:
        - pip
        - python {{ python_min }}
      run:
        - {{ pin_subpackage("xeus-python-shell-raw", exact=True) }}
        - ipython  >=7.21
    test:
      requires:
        - pip
        - python {{ python_min }}
      imports:
        - xeus_python_shell

  - name: xeus-python-shell-lite
    build:
      noarch: python
    requirements:
      host:
        - pip
        - python {{ python_min }}
      run:
        - {{ pin_subpackage("xeus-python-shell", exact=True) }}
        - packaging
        # This would be great, but it's on emscripten-forge. Maybe future us will do something about it?
        # - pyjs-rt >=3.1,<4
        - pyodide-http
    test:
      requires:
        - pip
        - python {{ python_min }}
      imports:
        - xeus_python_shell

about:
  home: https://github.com/jupyter-xeus/xeus-python-shell
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: The xeus-python core python logic.
  dev_url: https://github.com/jupyter-xeus/xeus-python-shell

extra:
  recipe-maintainers:
    - JohanMabille
    - martinRenou
